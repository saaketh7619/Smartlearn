name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        env:
          GITHUB_ACTIONS: 'true'
          NEXT_PUBLIC_BASE_PATH: '/Smartlearn'
          NEXT_PUBLIC_SUPABASE_URL: 'https://wvwhmeceincqfkfryqrs.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind2d2htZWNlaW5jcWZrZnJ5cXJzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkxNDA3MDcsImV4cCI6MjEwNDcxNjcwN30.aEkYQaLv3eydkuhJJ8Gcs1TD9WtnJLNkXL3woYPl4_8'
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: 'service_nk1ngue'
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: 'template_sptzhpb'
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: 'GoD5merb9lhnJGaD5'
          NEXT_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: gh-pages

